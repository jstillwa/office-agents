name: Release PowerPoint

on:
  push:
    tags:
      - "ppt-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release PowerPoint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality check
        run: pnpm check && pnpm test

      - name: Build
        run: pnpm build

      - name: Validate manifests
        run: pnpm --filter @office-agents/powerpoint exec office-addin-manifest validate manifest.xml && pnpm --filter @office-agents/powerpoint exec office-addin-manifest validate manifest.prod.xml

      - name: Generate CycloneDX SBOM
        run: npx -y @cyclonedx/cdxgen -r packages/powerpoint -o packages/powerpoint/sbom.cyclonedx.json

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#ppt-v}"
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" packages/powerpoint/CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No changelog entry found for ${VERSION}, falling back to Unreleased"
            NOTES=$(awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{if(found) exit} found{print}' packages/powerpoint/CHANGELOG.md)
          fi
          echo "$NOTES" > /tmp/release-notes.md

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/powerpoint/dist --project-name=openppt --branch=main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: |
            packages/powerpoint/dist/manifest.prod.xml
            packages/powerpoint/sbom.cyclonedx.json
